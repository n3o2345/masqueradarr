name: Publish Container Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/n3o2345/masqueradarr

jobs:
  docker:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify GITHUB_TOKEN and run context
        id: verify-token
        run: |
          # Fail if GITHUB_TOKEN is missing
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "GITHUB_TOKEN is missing. Ensure Actions has permission to access GITHUB_TOKEN."
            exit 1
          fi

          # If this is a pull_request, check whether it comes from a fork (secrets unavailable for forks)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Event is pull_request — checking whether it's from a fork..."
            PR_HEAD_REPO=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["pull_request"]["head"]["repo"]["full_name"])' "$GITHUB_EVENT_PATH") || {
              echo "Could not read pull_request head repo from event payload; aborting."; exit 1
            }
            if [ "$PR_HEAD_REPO" != "${{ github.repository }}" ]; then
              echo "This pull request comes from a fork ($PR_HEAD_REPO). Secrets (including tokens) are not available for forks. Aborting publish.";
              exit 1
            fi
          fi

          echo "GITHUB_TOKEN and run context look good."

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
